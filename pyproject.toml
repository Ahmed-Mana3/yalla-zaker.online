[project]
name = "yalla-zaker"
version = "0.1.0"
description = "yalla zaker — study tracker, focus clock, and friendly challenges"
requires-python = "~=3.12.0"
dependencies = [
    "Django==6.1.1",
    "dj-database-url==3.1.2",
    "psycopg2-binary==2.9.13",
    "whitenoise==6.12.0",
    "gunicorn==21.2.0",
]

[tool.vercel.scripts]
build = "python manage.py collectstatic --noinput && python manage.py migrate --noinput"