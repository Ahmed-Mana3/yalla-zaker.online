{% extends 'base.html' %}
{% block title %}Delete roadmap · yalla zaker{% endblock %}
{% block body %}
<div class="wrap page">
  <div class="panel form-card rm-danger-card">
    <div class="rm-danger-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </div>
    <h1 class="rm-danger-title">Remove "{{ roadmap.title }}"?</h1>
    <p class="section-meta rm-danger-note">This deletes the roadmap and its shared link. Your courses stay on your desk.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-actions rm-danger-actions">
        <button class="btn btn-danger" type="submit">Delete roadmap</button>
        <a class="btn btn-ghost" href="{% url 'roadmap_detail' slug=roadmap.slug %}">Keep it</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
