<span class="avatar avatar-{{ size|default:36 }}"
      style="--hue: {{ u.profile.avatar_hue|default:210 }};"
      aria-hidden="true">{% if u.profile.avatar_updated %}<img src="{% url 'avatar' username=u.username %}?v={{ u.profile.avatar_updated|date:'U' }}" alt="" loading="lazy">{% else %}{{ u.username|slice:":1"|upper }}{% endif %}</span>
